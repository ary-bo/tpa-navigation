<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css">
<style>
/* TPA Navigation v2.1 — design system */
:root{--bg:#f3f5f7;--card:#fff;--tx:#14202b;--mu:#66727f;--bd:#e2e7ec;--pr:#0e7c72;--pr2:#0a5f58;--prt:#fff;--prs:#e3f4f2;--g:#16a34a;--o:#f59e0b;--b:#2563eb;--r:#dc2626;--sh:0 1px 2px rgba(16,32,48,.06),0 4px 14px rgba(16,32,48,.07);--rad:14px}
:root[data-theme=dark]{--bg:#0d1217;--card:#161e26;--tx:#e9eef3;--mu:#98a5b2;--bd:#26313b;--pr:#2dd4bf;--pr2:#14b8a6;--prt:#04211e;--prs:#12332f;--sh:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{position:fixed;inset:0;width:100%;height:100dvh;overflow:hidden;background:var(--bg);color:var(--tx);font:15px/1.55 "Vazirmatn",system-ui,-apple-system,Tahoma,sans-serif;display:flex;flex-direction:column;overscroll-behavior:none}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-4px}
/* header */
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:linear-gradient(135deg,var(--pr2),var(--pr));color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15);z-index:5}
:root[data-theme=dark] header{color:var(--prt)}
#title{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;letter-spacing:.2px;white-space:nowrap;flex:none}#title svg{width:24px;height:24px}
#hr{display:flex;gap:8px;align-items:center;font-size:11px;opacity:.95}#dinfo{direction:ltr;opacity:.9;white-space:nowrap;font-size:10px}
#rf{background:rgba(255,255,255,.18);border:0;color:inherit;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;padding:0;cursor:pointer}#rf svg{width:18px;height:18px}
#net{font-size:12px}
main{flex:1;min-height:0;overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
main.mapv{overflow:hidden;display:flex;flex-direction:column}
/* nav */
nav{display:flex;direction:ltr;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:2px;z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:6px 2px 4px;font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:12px;cursor:pointer}
nav button .i{display:grid;place-items:center;width:46px;height:28px;border-radius:14px;transition:background .15s}nav button .i svg{width:22px;height:22px}
nav button.on{color:var(--pr);font-weight:700}nav button.on .i{background:var(--prs)}
/* layout & cards */
.pad{padding:14px 16px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}.mu{color:var(--mu);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--rad);padding:13px 14px;margin-bottom:11px;box-shadow:var(--sh)}
.card.st{border-inline-start:5px solid var(--bd)}.card.st.green{border-inline-start-color:var(--g)}.card.st.orange{border-inline-start-color:var(--o)}.card.st.blue{border-inline-start-color:var(--b)}
.card[data-id]{cursor:pointer;transition:transform .08s}.card[data-id]:active{transform:scale(.99)}
.card b{font-weight:700;font-size:15px}
h2{font-size:18px;margin:4px 0 12px;font-weight:700}h3{font-size:15px;margin:14px 0 8px;font-weight:700;color:var(--pr)}
/* controls */
input,select,textarea,button.btn{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:9px 12px;min-height:42px;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pr);outline-offset:-1px;border-color:var(--pr)}
input[type=search],input[type=text],input[type=password]{width:100%}
button.btn,label.btn{cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center;font-weight:600;transition:background .12s,transform .08s}
button.btn:active{transform:scale(.97)}
button.pri{background:var(--pr);color:var(--prt);border-color:var(--pr)}button.dng{color:var(--r);border-color:color-mix(in srgb,var(--r) 35%,var(--bd))}
button.sm{min-height:34px;padding:4px 12px;font-size:13px;border-radius:10px}button:disabled{opacity:.4}
.visit-plan-box{border:1px solid var(--bd);border-radius:16px;padding:13px;margin:12px 0;background:var(--card);box-shadow:var(--sh)}
.visit-plan-box h3{margin:0 0 11px;color:var(--pr);font-size:15px}
.visit-plan-actions,.store-action-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.visit-plan-actions .btn,.store-action-row .btn{width:100%;min-width:0;min-height:44px;padding:8px 6px;font-size:clamp(12px,2.4vw,16px);line-height:1.2;white-space:nowrap;letter-spacing:-.02em}
button.vp-add{background:#16864a;color:#fff;border-color:#16864a}
button.vp-add:disabled{background:#246b3e;color:#fff;border-color:#246b3e;opacity:.58;cursor:not-allowed}
button.vp-remove{background:#c83d4d;color:#fff;border-color:#c83d4d}
button.vp-remove:disabled{background:#8f2935;color:#fff;border-color:#8f2935;opacity:.72;cursor:not-allowed}
button.store-map-action{background:#2876b9;color:#fff;border-color:#2876b9}
button.store-audit-action{background:#8054b8;color:#fff;border-color:#8054b8}
.chip{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--bd);color:var(--mu);background:var(--bg)}
.chip.r{color:#fff;background:var(--r);border-color:var(--r)}.chip.o{background:var(--o);color:#2a1d00;border-color:var(--o)}.chip.g{background:var(--g);color:#fff;border-color:var(--g)}.chip.vp{background:#9333ea;color:#fff;border-color:#9333ea}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-inline-end:6px;vertical-align:middle}
.g{background:var(--g)}.o{background:var(--o)}.b{background:var(--b)}.r{background:var(--r)}
.num{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:50%;background:var(--pr);color:var(--prt);font-weight:700;font-size:13px;margin-inline-end:8px}
/* map */
main.mapv{position:relative}#map{flex:1;min-height:0;z-index:0}
.mapbar{position:absolute;top:10px;left:10px;right:10px;z-index:500;padding:6px 8px;background:var(--card);border-radius:16px;box-shadow:var(--sh);display:flex;gap:6px;align-items:center}
.mapbar input{border:0;background:transparent;min-height:38px;flex:1}.mapbar input:focus{outline:0}
.mapbar .btn{min-height:38px;border-radius:12px}
.legend{position:absolute;bottom:12px;left:10px;max-width:calc(100% - 84px);z-index:500;font-size:12px;padding:7px 11px;background:var(--card);border-radius:12px;box-shadow:var(--sh);display:flex;gap:10px;flex-wrap:wrap}
.vp-map-marker{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#7b2cbf;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.55);transform:translate(6px,-13px);pointer-events:none}
.vp-map-marker .ic{width:12px;height:12px;stroke:#fff;stroke-width:2.2;vertical-align:0}
.vp-map-legend{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.vp-map-legend .vp-map-marker{transform:none;flex:none}
.leaflet-bottom.leaflet-right{margin-bottom:6px}.leaflet-control-zoom{border:0!important;box-shadow:var(--sh)!important;border-radius:12px!important;overflow:hidden}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--pr);color:#fff;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);display:grid;place-items:center}
.pin>span{transform:rotate(45deg);font:700 13px system-ui}.pin.pHigh{background:#dc2626}.pin.pLow{background:#64748b}
/* sheet / toast */
#sheet{position:fixed;inset:0;background:rgba(10,18,26,.5);z-index:2000;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
#sheet[hidden],#toast[hidden]{display:none}
#sheet .s{background:var(--bg);width:100%;max-width:720px;max-height:90dvh;overflow:auto;border-radius:22px 22px 0 0;padding:10px 16px;padding-bottom:max(16px,env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.25)}
#sheet .s::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--bd);margin:2px auto 12px}
#toast{position:fixed;bottom:88px;inset-inline:16px;background:#101a24;color:#fff;border-radius:14px;padding:11px 16px;z-index:3000;text-align:center;box-shadow:var(--sh);font-size:14px}
table.t{width:100%;border-collapse:collapse;font-size:13px}table.t td,table.t th{border-bottom:1px solid var(--bd);padding:7px 4px;text-align:start;vertical-align:top}table.t th{color:var(--mu);font-weight:600}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:14px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}.kv dt{color:var(--mu)}.kv dd{margin:0;word-break:break-word}
.tabs{display:flex;gap:6px;overflow:auto;padding-bottom:6px}.tabs button{white-space:nowrap;text-align:center;line-height:1.3}.tabs .on{background:var(--pr);color:var(--prt);border-color:var(--pr)}
.err{color:var(--r)}label.f{display:block;margin:10px 0 4px;color:var(--mu);font-size:13px;font-weight:600}

C\u062F\u0627 \u0646\u0634\u062F": "Customer not found", "\u0627\u06CC\u0646 \u0647\u0641\u062A\u0647": "This week", "\u0637\u06CC \u06F2 \u0647\u0641\u062A\u0647 \u0627\u062E\u06CC\u0631": "Within the last 2 weeks", "\u0637\u06CC \u06CC\u06A9 \u0645\u0627\u0647 \u0627\u062E\u06CC\u0631": "Within the last month", "\u0628\u06CC\u0634\u062A\u0631 \u0627\u0632 \u06CC\u06A9 \u0645\u0627\u0647 \u0642\u0628\u0644": "More than a month ago", "\u0647\u0631\u06AF\u0632": "Never", "\u0645\u0637\u0645\u0626\u0646 \u0646\u06CC\u0633\u062A\u0645": "Not sure", "\u062F\u0631 \u062D\u0627\u0644 \u062D\u0627\u0636\u0631 \u0645\u062D\u0635\u0648\u0644\u0627\u062A \u063A\u0646\u0686\u0647 \u0631\u0627 \u0639\u0631\u0636\u0647 \u0645\u06CC\u200C\u06A9\u0646\u062F": "Currently sells Ghoncheh products", "\u0642\u0628\u0644\u0627\u064B \u0639\u0631\u0636\u0647 \u0645\u06CC\u200C\u06A9\u0631\u062F\u0645\u060C \u0648\u0644\u06CC \u0627\u0644\u0627\u0646 \u0646\u0647": "Used to sell, but not anymore", "\u0647\u06CC\u0686\u200C\u0648\u0642\u062A \u0639\u0631\u0636\u0647 \u0646\u06A9\u0631\u062F\u0647\u200C\u0627\u0645": "Never sold", "\u067E\u0627\u06CC\u06CC\u0646 \u0628\u0648\u062F\u0646 \u062A\u0642\u0627\u0636\u0627": "Low demand", "\u062D\u0627\u0634\u06CC\u0647 \u0633\u0648\u062F \u0646\u0627\u0645\u0646\u0627\u0633\u0628": "Poor profit margin", "\u0634\u0631\u0627\u06CC\u0637 \u067E\u0631\u062F\u0627\u062E\u062A \u0646\u0627\u0645\u0646\u0627\u0633\u0628": "Unfavorable payment terms", "\u0645\u0634\u06A9\u0644\u0627\u062A \u062A\u0648\u0632\u06CC\u0639 \u0648 \u062A\u062D\u0648\u06CC\u0644": "Distribution and delivery problems", "\u06A9\u0645\u0628\u0648\u062F \u06CC\u0627 \u0639\u062F\u0645 \u062A\u0623\u0645\u06CC\u0646 \u0645\u062D\u0635\u0648\u0644\u0627\u062A \u0645\u0648\u0631\u062F\u0646\u06CC\u0627\u0632": "Shortage or non-supply of required products", "\u0633\u0627\u06CC\u0631 \u0645\u0648\u0627\u0631\u062F (\u0647\u0645\u0631\u0627\u0647 \u0628\u0627 \u062A\u0648\u0636\u06CC\u062D)": "Other (please explain)", "\u0645\u0648\u062C\u0648\u062F\u06CC \u0645\u062D\u0635\u0648\u0644\u0627\u062A \u063A\u0646\u0686\u0647 \u062F\u0631 \u0641\u0631\u0648\u0634\u06AF\u0627\u0647 \u06A9\u0627\u0641\u06CC \u0628\u0648\u062F": "The store had enough Ghoncheh stock", "\u0645\u062D\u0635\u0648\u0644 \u0645\u0648\u0631\u062F\u0646\u06CC\u0627\u0632 \u0645\u0648\u062C\u0648\u062F \u0646\u0628\u0648\u062F": "The needed product was unavailable", "\u062D\u0627\u0634\u06CC\u0647 \u0633\u0648\u062F \u067E\u06CC\u0634\u0646\u0647\u0627\u062F\u06CC \u0631\u0642\u0628\u0627 \u0628\u0647\u062A\u0631 \u0628\u0648\u062F": "Competitors offered a better profit margin", "\u0634\u0631\u0627\u06CC\u0637 \u067E\u0631\u062F\u0627\u062E\u062A \u0631\u0642\u0628\u0627 \u0628\u0647\u062A\u0631 \u0628\u0648\u062F": "Competitors offered better payment terms", "\u0627\u0632 \u0628\u0627\u0632\u0627\u0631 \u0622\u0632\u0627\u062F \u0628\u0627 \u0642\u06CC\u0645\u062A \u0645\u0646\u0627\u0633\u0628\u200C\u062A\u0631 \u062E\u0631\u06CC\u062F \u06A9\u0631\u062F\u0645": "Bought from the open market at a better price", "\u062A\u062C\u0631\u0628\u0647 \u0646\u0627\u0645\u0646\u0627\u0633\u0628 \u062E\u0631\u06CC\u062F \u0642\u0628\u0644\u06CC": "Bad previous purchase experience", "\u0645\u0634\u062A\u0631\u06CC \u06CC\u0627 \u062A\u0642\u0627\u0636\u0627\u06CC \u06A9\u0627\u0641\u06CC \u0628\u0631\u0627\u06CC \u0645\u062D\u0635\u0648\u0644\u0627\u062A \u0646\u062F\u0627\u0634\u062A\u0645": "Not enough customers or demand for the products", "\u062E\u06CC\u0631\u060C \u0647\u0645\u0647\u200C\u0686\u06CC\u0632 \u062E\u0648\u0628 \u0628\u0648\u062F\u0647 \u0627\u0633\u062A": "No, everything has been fine", "\u0628\u0644\u0647\u060C \u0645\u0634\u06A9\u0644 \u062F\u0627\u0634\u062A\u0647\u200C\u0627\u0645": "Yes, I have had problems", "\u062A\u0623\u062E\u06CC\u0631 \u062F\u0631 \u062A\u062D\u0648\u06CC\u0644": "Late delivery", "\u0646\u0627\u0642\u0635 \u0628\u0648\u062F\u0646 \u0633\u0641\u0627\u0631\u0634": "Incomplete order", "\u0627\u0634\u062A\u0628\u0627\u0647 \u0628\u0648\u062F\u0646 \u0645\u062D\u0635\u0648\u0644\u0627\u062A \u062A\u062D\u0648\u06CC\u0644\u06CC": "Wrong products delivered", "\u0622\u0633\u06CC\u0628\u200C\u062F\u06CC\u062F\u06AF\u06CC \u0645\u062D\u0635\u0648\u0644\u0627\u062A": "Damaged products", "\u0645\u063A\u0627\u06CC\u0631\u062A \u0642\u06CC\u0645\u062A": "Price discrepancy", "\u062D\u0627\u0634\u06CC\u0647 \u0633\u0648\u062F \u06CC\u0627 \u062A\u0648\u0627\u0641\u0642": "Profit margin or agreement issue", "\u0647\u06CC\u0686\u200C\u06A9\u062F\u0627\u0645 \u0627\u0632 \u0645\u062D\u0635\u0648\u0644\u0627\u062A \u0645\u0631\u062C\u0648\u0639 \u0646\u0634\u062F\u0647 \u0627\u0633\u062A": "None of the products were returned", "\u0628\u062E\u0634\u06CC \u0627\u0632 \u0645\u062D\u0635\u0648\u0644\u0627\u062A \u0645\u0631\u062C\u0648\u0639 \u0634\u062F\u0647 \u0627\u0633\u062A": "Some products were returned", "\u062A\u0645\u0627\u0645 \u0645\u062D\u0635\u0648\u0644\u0627\u062A \u0645\u0631\u062C\u0648\u0639 \u0634\u062F\u0647 \u0627\u0633\u062A": "All products were returned", "\u0645\u062D\u0635\u0648\u0644 \u0627\u0634\u062A\u0628\u0627\u0647 \u062A\u062D\u0648\u06CC\u0644 \u062F\u0627\u062F\u0647 \u0634\u062F\u0647 \u0627\u0633\u062A": "A wrong product was delivered", "\u0633\u0641\u0627\u0631\u0634 \u0646\u0627\u0642\u0635 \u06CC\u0627 \u0645\u062D\u0635\u0648\u0644\u0627\u062A \u0622\u0633\u06CC\u0628\u200C\u062F\u06CC\u062F\u0647 \u062A\u062D\u0648\u06CC\u0644 \u062F\u0627\u062F\u0647 \u0634\u062F\u0647\u200C\u0627\u0646\u062F": "Incomplete order or damaged products delivered", "\u0633\u0641\u0627\u0631\u0634 \u062F\u0631 \u0631\u0648\u0632 \u062A\u0648\u0627\u0641\u0642\u200C\u0634\u062F\u0647 \u062A\u062D\u0648\u06CC\u0644 \u0646\u0634\u062F\u0647 \u0627\u0633\u062A": "Order was not delivered on the agreed day", "\u0642\u06CC\u0645\u062A \u0628\u0627 \u062A\u0648\u0627\u0641\u0642 \u0645\u063A\u0627\u06CC\u0631\u062A \u062F\u0627\u0634\u062A\u0647 \u0627\u0633\u062A": "Price differed from the agreement", "\u0647\u0646\u06AF\u0627\u0645 \u062A\u062D\u0648\u06CC\u0644 \u0648\u062C\u0647 \u0646\u0642\u062F \u06A9\u0627\u0641\u06CC \u0648\u062C\u0648\u062F \u0646\u062F\u0627\u0634\u062A\u0647 \u0627\u0633\u062A": "Not enough cash at delivery", "\u0645\u0648\u062C\u0648\u062F\u06CC \u0646\u0642\u062F\u06CC \u0641\u0631\u0648\u0634\u06AF\u0627\u0647 \u062F\u0631 \u0633\u0627\u0639\u0627\u062A \u067E\u0627\u06CC\u0627\u0646\u06CC \u0631\u0648\u0632 \u062A\u0645\u0627\u0645 \u0634\u062F\u0647 \u0627\u0633\u062A": "The store ran out of cash late in the day", "\u0642\u0627\u0628\u0644 \u062F\u0633\u062A\u0631\u0633 \u0627\u0633\u062A": "Accessible", "\u0642\u0627\u0628\u0644 \u062F\u0633\u062A\u0631\u0633 \u0646\u06CC\u0633\u062A": "Not accessible", "\u0645\u0646\u0627\u0633\u0628\u061B \u0645\u062D\u0635\u0648\u0644\u0627\u062A \u0645\u0646\u0638\u0645\u060C \u0642\u0627\u0628\u0644 \u0645\u0634\u0627\u0647\u062F\u0647 \u0648 \u062F\u0631 \u062F\u0633\u062A\u0631\u0633 \u0647\u0633\u062A\u0646\u062F": "Good: products are neat, visible and reachable", "\u0646\u0627\u0645\u0646\u0627\u0633\u0628\u061B \u0686\u06CC\u062F\u0645\u0627\u0646 \u0646\u0627\u0645\u0646\u0638\u0645 \u06CC\u0627 \u062F\u0633\u062A\u0631\u0633\u06CC \u0648 \u0645\u0634\u0627\u0647\u062F\u0647 \u062F\u0634\u0648\u0627\u0631 \u0627\u0633\u062A": "Poor: untidy layout or hard to see or reach", "\u062E\u0631\u06CC\u062F \u0627\u0632 \u0628\u0627\u0632\u0627\u0631 \u0622\u0632\u0627\u062F": "Buying from the open market" } };
