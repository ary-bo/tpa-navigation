<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#17212b;--mu:#64707d;--bd:#dfe3e8;--pr:#0f766e;--prt:#fff;--g:#16a34a;--o:#f59e0b;--b:#2563eb;--r:#dc2626}
:root[data-theme=dark]{--bg:#0f1418;--card:#182028;--tx:#e8edf2;--mu:#93a0ad;--bd:#2a343e;--pr:#2dd4bf;--prt:#06201d}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,"Vazirmatn",Tahoma,sans-serif;display:flex;flex-direction:column;overscroll-behavior:none}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:var(--pr);color:var(--prt);padding-top:max(8px,env(safe-area-inset-top))}
#net{font-size:12px;opacity:.9}
main{flex:1;min-height:0;overflow:auto;position:relative}
main.mapv{overflow:hidden;display:flex;flex-direction:column}
nav{display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:10px 2px;font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .i{font-size:20px;line-height:1}nav button.on{color:var(--pr);font-weight:700}
.pad{padding:12px 14px}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}.mu{color:var(--mu);font-size:13px}
h2{font-size:17px;margin:4px 0 10px}h3{font-size:15px;margin:10px 0 6px}
input,select,textarea,button.btn{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;min-height:40px}
input[type=search],input[type=text]{width:100%}
button.btn{cursor:pointer}button.pri{background:var(--pr);color:var(--prt);border-color:var(--pr);font-weight:600}button.dng{color:var(--r)}button.sm{min-height:32px;padding:4px 10px;font-size:13px}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--bd);color:var(--mu)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-inline-end:6px;vertical-align:middle}
.g{background:var(--g)}.o{background:var(--o)}.b{background:var(--b)}.r{background:var(--r)}
.chip.r{color:#fff;background:var(--r);border-color:var(--r)}.chip.o{background:var(--o);color:#222;border-color:var(--o)}.chip.g{background:var(--g);color:#fff;border-color:var(--g)}
#map{flex:1;min-height:0;z-index:0}
.mapbar{padding:8px;background:var(--card);border-bottom:1px solid var(--bd);display:flex;gap:6px;align-items:center}
.legend{font-size:12px;padding:4px 10px;background:var(--card);display:flex;gap:12px;flex-wrap:wrap;border-top:1px solid var(--bd)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2000;display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden],#toast[hidden]{display:none}
#sheet .s{background:var(--bg);width:100%;max-width:720px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px;padding-bottom:max(14px,env(safe-area-inset-bottom))}
#toast{position:fixed;bottom:76px;inset-inline:16px;background:#111;color:#fff;border-radius:10px;padding:10px 14px;z-index:3000;text-align:center}
